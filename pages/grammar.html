<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>语法系统</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.topic-card {
  background: var(--bg-card); border-radius: var(--radius-lg);
  padding: 14px; margin-bottom: 10px;
  box-shadow: var(--shadow); cursor: pointer;
  border: none; width: 100%; text-align: left;
  font-family: inherit; display: flex; align-items: center;
}
.topic-icon-big {
  font-size: 32px; width: 48px; height: 48px;
  border-radius: 50%; display: flex;
  align-items: center; justify-content: center;
  margin-right: 12px; flex-shrink: 0;
}
.topic-info { flex: 1; min-width: 0; }
.topic-title { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
.topic-title-en { font-size: 12px; color: var(--text-secondary); margin: 0 0 2px; }
.topic-summary { font-size: 12px; color: var(--text-tertiary); margin: 0; }
.topic-unit-tag {
  display: inline-block; padding: 2px 8px;
  border-radius: 10px; font-size: 11px;
  background: var(--bg); color: var(--text-secondary);
  margin-top: 4px;
}

.topic-header {
  color: white; padding: 20px 18px;
  border-radius: var(--radius-lg); margin-bottom: 14px;
}
.topic-header .icon { font-size: 36px; margin-bottom: 6px; }
.topic-header h2 { margin: 0 0 4px; font-size: 22px; }
.topic-header .titleEn { font-size: 13px; opacity: 0.9; margin: 0 0 8px; }
.topic-header .summary { font-size: 14px; opacity: 0.95; }

.block {
  background: var(--bg-card); border-radius: var(--radius-md);
  padding: 14px; margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.block-title {
  font-size: 13px; font-weight: 600;
  color: var(--primary); text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 8px;
}

.formula-row {
  background: var(--bg); padding: 10px 12px;
  border-radius: var(--radius-sm); margin-bottom: 8px;
  border-left: 3px solid var(--primary);
}
.formula-pattern {
  font-size: 13px; font-weight: 600;
  color: var(--text); margin-bottom: 4px;
  font-family: 'Menlo', 'Consolas', monospace;
}
.formula-example {
  font-size: 13px; color: var(--text-secondary);
  font-style: italic;
}

.explanation-text {
  font-size: 13px; color: var(--text);
  line-height: 1.7; white-space: pre-line;
}

.example-row {
  background: var(--bg); padding: 10px 12px;
  border-radius: var(--radius-sm); margin-bottom: 8px;
}
.example-en {
  font-size: 14px; font-weight: 500; margin-bottom: 4px;
}
.example-zh {
  font-size: 12px; color: var(--text-secondary); margin-bottom: 4px;
}
.example-point {
  font-size: 11px; color: #FF9500; font-style: italic;
}
.example-actions { margin-top: 6px; }
.btn-mini {
  padding: 4px 9px; background: var(--primary-light);
  color: var(--primary); border: none; border-radius: 11px;
  font-size: 11px; cursor: pointer; font-family: inherit;
}

.practice-q {
  background: var(--bg); padding: 12px;
  border-radius: var(--radius-md); margin-bottom: 10px;
}
.practice-q-text {
  font-size: 14px; font-weight: 500; margin-bottom: 8px;
}
.practice-opts {
  display: flex; flex-direction: column; gap: 6px;
}
.practice-opt {
  padding: 8px 12px; background: var(--bg-card);
  border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-size: 13px; text-align: left; cursor: pointer;
  font-family: inherit;
}
.practice-opt:active { transform: scale(0.98); }
.practice-opt.correct { background: #E8F8EC; border-color: #34C759; color: #2E8B3D; }
.practice-opt.wrong { background: #FFE5E5; border-color: #FF3B30; color: #C42828; }
.practice-exp {
  margin-top: 6px; padding: 6px 10px;
  background: #FFF4E0; border-radius: var(--radius-sm);
  font-size: 12px; color: #B8740C;
}
</style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <button class="back-btn" onclick="goBack()">‹ 返回</button>
    <h1 class="page-title">语法系统</h1>
    <div style="width:60px"></div>
  </div>

  <div id="topic-list">
    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">译林 4B 8 大语法点系统讲解</p>
  </div>

  <div id="topic-detail" style="display:none">
    <div class="topic-header" id="t-header">
      <div class="icon" id="t-icon"></div>
      <h2 id="t-title"></h2>
      <div class="titleEn" id="t-titleEn"></div>
      <div class="summary" id="t-summary"></div>
    </div>
    
    <div class="block">
      <div class="block-title">📐 句型公式</div>
      <div id="t-formulas"></div>
    </div>
    
    <div class="block">
      <div class="block-title">💡 详细讲解</div>
      <div class="explanation-text" id="t-explanation"></div>
    </div>
    
    <div class="block">
      <div class="block-title">📖 例句</div>
      <div id="t-examples"></div>
    </div>
    
    <div class="block">
      <div class="block-title">✏️ 练习</div>
      <div id="t-practice"></div>
    </div>
  </div>
</div>

<script src="../data/grammar.js"></script>
<script src="../js/core.js"></script>
<script>
let currentTopic = null;
let practiceAnswers = {};

function goBack() {
  if (document.getElementById('topic-detail').style.display === 'block') {
    document.getElementById('topic-detail').style.display = 'none';
    document.getElementById('topic-list').style.display = 'block';
    window.scrollTo(0, 0);
  } else {
    location.href = '../index.html';
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function escapeJs(s) {
  return String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function renderTopics() {
  const list = document.getElementById('topic-list');
  GRAMMAR.topics.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'topic-card';
    btn.innerHTML = `
      <div class="topic-icon-big" style="background:${t.color}22;color:${t.color}">${t.icon}</div>
      <div class="topic-info">
        <div class="topic-title">${escapeHtml(t.titleZh)}</div>
        <div class="topic-title-en">${escapeHtml(t.title)}</div>
        <div class="topic-summary">${escapeHtml(t.summary)}</div>
        <span class="topic-unit-tag">📖 Unit ${t.unit}</span>
      </div>
      <div style="color:var(--text-tertiary);font-size:20px">›</div>
    `;
    btn.onclick = () => openTopic(t);
    list.appendChild(btn);
  });
}
renderTopics();

function openTopic(t) {
  currentTopic = t;
  practiceAnswers = {};
  document.getElementById('topic-list').style.display = 'none';
  document.getElementById('topic-detail').style.display = 'block';
  
  // Header
  const header = document.getElementById('t-header');
  header.style.background = `linear-gradient(135deg, ${t.color}, ${t.color}99)`;
  document.getElementById('t-icon').textContent = t.icon;
  document.getElementById('t-title').textContent = t.titleZh;
  document.getElementById('t-titleEn').textContent = t.title;
  document.getElementById('t-summary').textContent = t.summary;
  
  // Formulas
  document.getElementById('t-formulas').innerHTML = t.formula.map(f => `
    <div class="formula-row">
      <div class="formula-pattern">${escapeHtml(f.pattern)}</div>
      <div class="formula-example">"${escapeHtml(f.example)}"</div>
    </div>
  `).join('');
  
  // Explanation
  document.getElementById('t-explanation').textContent = t.explanation;
  
  // Examples
  document.getElementById('t-examples').innerHTML = t.examples.map(e => `
    <div class="example-row">
      <div class="example-en">${escapeHtml(e.en)}</div>
      <div class="example-zh">${escapeHtml(e.zh)}</div>
      <div class="example-point">💡 ${escapeHtml(e.point)}</div>
      <div class="example-actions">
        <button class="btn-mini" onclick="Speech.speak('${escapeJs(e.en)}', {rate: 0.85})">🔊 听</button>
      </div>
    </div>
  `).join('');
  
  // Practice
  document.getElementById('t-practice').innerHTML = t.practice.map((p, i) => `
    <div class="practice-q" id="prac-${i}">
      <div class="practice-q-text">${i+1}. ${escapeHtml(p.q)}</div>
      <div class="practice-opts">
        ${p.options.map((o, oi) => `
          <button class="practice-opt" onclick="answerPractice(${i}, ${oi})">${String.fromCharCode(65 + oi)}. ${escapeHtml(o)}</button>
        `).join('')}
      </div>
    </div>
  `).join('');
  
  window.scrollTo(0, 0);
}

function answerPractice(pi, oi) {
  if (practiceAnswers[pi] !== undefined) return;
  const p = currentTopic.practice[pi];
  practiceAnswers[pi] = oi;
  
  const wrap = document.getElementById('prac-' + pi);
  const opts = wrap.querySelectorAll('.practice-opt');
  opts.forEach(o => o.style.pointerEvents = 'none');
  
  const correct = oi === p.answer;
  opts[oi].classList.add(correct ? 'correct' : 'wrong');
  if (!correct) opts[p.answer].classList.add('correct');
  
  // 显示解释
  wrap.insertAdjacentHTML('beforeend', `
    <div class="practice-exp">${correct ? '✅' : '💡'} ${escapeHtml(p.exp)}</div>
  `);
  
  Tracking.log('grammar_practice', { topicId: currentTopic.id, qi: pi, correct });
}
</script>
</body>
</html>
